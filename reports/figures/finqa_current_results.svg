<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#ffffff"/>
  <style>
    text { font-family: "DejaVu Sans"; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #52606d; }
    .label { font-size: 16px; }
    .small { font-size: 14px; fill: #52606d; }
    .value { font-size: 15px; font-weight: 700; }
    .panel { font-size: 19px; font-weight: 700; fill: #173b57; }
  </style>
  <text x="600" y="42" text-anchor="middle" class="title">FinQA — Numerical IR, kết quả hiện có</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Official execution accuracy là metric chính; ratio/% equivalent chỉ là diagnostic</text>

  <rect x="36" y="96" width="1128" height="474" rx="14" fill="#f8fafc" stroke="#cad5df"/>
  <text x="60" y="132" class="panel">Hai protocol/subset độc lập</text>
  <line x1="330" y1="175" x2="1030" y2="175" stroke="#94a3b8"/>
  <g class="small" text-anchor="middle">
    <text x="330" y="166">0</text><text x="400" y="166">10</text><text x="470" y="166">20</text><text x="540" y="166">30</text>
    <text x="610" y="166">40</text><text x="680" y="166">50</text><text x="750" y="166">60</text><text x="820" y="166">70</text>
    <text x="890" y="166">80</text><text x="960" y="166">90</text><text x="1030" y="166">100</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="330" y1="178" x2="330" y2="490"/><line x1="400" y1="178" x2="400" y2="490"/><line x1="470" y1="178" x2="470" y2="490"/>
    <line x1="540" y1="178" x2="540" y2="490"/><line x1="610" y1="178" x2="610" y2="490"/><line x1="680" y1="178" x2="680" y2="490"/>
    <line x1="750" y1="178" x2="750" y2="490"/><line x1="820" y1="178" x2="820" y2="490"/><line x1="890" y1="178" x2="890" y2="490"/>
    <line x1="960" y1="178" x2="960" y2="490"/><line x1="1030" y1="178" x2="1030" y2="490"/>
  </g>

  <text x="60" y="229" class="label">1–2 step core, shard01</text>
  <text x="60" y="252" class="small">n=100 · 0 failed</text>
  <rect x="330" y="205" width="308" height="26" rx="3" fill="#8b5cf6"/><text x="646" y="224" class="value">Official 44.00</text>
  <rect x="330" y="239" width="322" height="26" rx="3" fill="#16a085"/><text x="660" y="258" class="value">Ratio/% 46.00</text>

  <text x="60" y="357" class="label">Exactly 2-step core pilot</text>
  <text x="60" y="380" class="small">n=30 · 6 failed</text>
  <rect x="330" y="333" width="117" height="26" rx="3" fill="#8b5cf6"/><text x="455" y="352" class="value">Official 16.67</text>
  <rect x="330" y="367" width="397" height="26" rx="3" fill="#16a085"/><text x="735" y="386" class="value">Ratio/% 56.67</text>

  <rect x="60" y="438" width="1030" height="95" rx="8" fill="#fff8e8" stroke="#e3bf65"/>
  <text x="82" y="469" class="small">Khoảng cách lớn ở pilot n=30 cho thấy normalization tỷ lệ/phần trăm ảnh hưởng mạnh.</text>
  <text x="82" y="495" class="small">Không dùng diagnostic 56.67% để thay thế official score 16.67%; hai subset cũng không dùng để suy ra xu hướng.</text>
</svg>
